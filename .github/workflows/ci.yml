name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bot:
    name: Bot (unit, build, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: bot
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      # Job logs need a GitHub sign-in; on failure the tail of the output also goes to the public run summary.
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            { echo "### Bot unit tests failed"; echo; echo '```text'; tail -n 150 test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=vitest output (tail)::$(tail -n 40 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Build and typecheck
        run: npm run build
      - name: Bundle check
        run: npm run check:bundle
      - name: Cache the Firestore emulator
        uses: actions/cache@v6
        with:
          path: .firebase/emulators
          key: firestore-emulator-${{ hashFiles('bot/package-lock.json') }}
      - name: Emulator suites
        run: |
          set -o pipefail
          npm run test:emulator -- auth pairing rules sync delivery purge cleanup 2>&1 | tee test.log || {
            { echo "### Emulator suites failed"; echo; echo '```text'; tail -n 150 test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=emulator output (tail)::$(tail -n 40 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

  companion:
    name: Companion (licenses, tests)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.6'
          cache: pip
          cache-dependency-path: companion/requirements.lock
      # tests/test_e2e_simulated.py builds and serves the real bot backend.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Install the bot for the end-to-end test
        working-directory: bot
        run: npm ci
      - name: Install
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.lock
      - name: License texts
        run: .venv\Scripts\python.exe tools\licenses.py check
      - name: Tests
        run: |
          .venv\Scripts\python.exe -m pytest -q -rfE 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = @('### Companion tests failed', '', '```text') + (Get-Content test.log -Tail 150) + @('```')
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            # Annotations are public on a public repository; logs and summaries need a sign-in.
            Get-Content test.log | Where-Object { $_ -match '^(FAILED|ERROR) ' } | Select-Object -First 20 | ForEach-Object { "::error title=pytest::$_" }
            $tail = (Get-Content test.log -Tail 40) -join '%0A'
            "::error title=pytest output (tail)::$tail"
          }
          exit $code
